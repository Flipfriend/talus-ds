name: Sync Notion docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "talus-ds/src/**"
      - "scripts/sync-notion-docs.mjs"
      - ".github/workflows/sync-notion.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync Token Sets to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TOKEN_SETS_DB_ID: ${{ secrets.NOTION_TOKEN_SETS_DB_ID }}
          NOTION_HUB_PAGE_ID: ${{ secrets.NOTION_HUB_PAGE_ID }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/sync-notion-docs.mjs
